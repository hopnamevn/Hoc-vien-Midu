<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Học Viện Sức Khỏe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
  header { background: #2e7d32; color: white; padding: 2rem; text-align: center; }
  header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
  header p { font-size: 1rem; opacity: 0.9; }
  .tools { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 2rem; justify-content: center; max-width: 900px; margin: 0 auto; }
  .card { background: white; border-radius: 12px; padding: 1.5rem; width: 200px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
  .card:hover { transform: translateY(-4px); }
  .card .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .card h2 { font-size: 1rem; color: #2e7d32; }
  footer { text-align: center; padding: 2rem; color: #888; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>Học Viện Sức Khỏe</h1>
  <p>Công cụ hỗ trợ chuyên viên</p>
</header>
<div class="tools">
  <div class="card">
    <div class="icon">📏</div>
    <h2>Chuyên viên Chiều cao</h2>
  </div>
  <div class="card">
    <div class="icon">🌸</div>
    <h2>Chuyên viên Phụ nữ Viên mãn</h2>
  </div>
  <div class="card">
    <div class="icon">🦴</div>
    <h2>Chuyên viên Xương khớp</h2>
  </div>
  <div class="card">
    <div class="icon">💧</div>
    <h2>Chia sẻ viên Nước tốt</h2>
  </div>
</div>
<footer>© 2026 Học Viện Sức Khỏe</footer>
</body>
</html>
